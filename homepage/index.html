<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080909" />
    <meta name="description" content="个人摄影书架。选择一本相册，翻阅旅途中的光与影。" />
    <title>On the Shelf — Photo Books Library</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="collection.css" />
    <script type="module" src="collection.js"></script>
  </head>
  <body>
    <main class="library-shell">
      <header class="masthead">
        <div>
          <h1>Photo Books Library</h1>
          <p>A personal collection / 私人藏书</p>
          <p class="masthead__count" id="book-count"></p>
          <button class="order-reset" type="button" hidden>重置排序 ↺</button>
        </div>
        <p class="masthead__aside">
          <span lang="zh-CN">摄影，装订成册。</span>
          On the shelf
        </p>
      </header>
      <div class="shelf-stage">
        <div class="shelf-viewport">
          <ol class="shelf" aria-label="All photobooks"></ol>
        </div>
      </div>
      <footer class="library-footer">
        <div class="shelf-scroll-cue">
          <span class="scroll-label"></span>
          <span class="shelf-progress" aria-hidden="true" hidden><span></span></span>
        </div>
        <span class="footer-selection" aria-hidden="true">PHOTOGRAPHS, BOUND.</span>
        <span class="footer-note">
          <span class="desktop-note">拖动排列 · 点击翻阅 ↗</span>
          <span class="mobile-note">点击翻阅 · 长按拖动排序</span>
        </span>
      </footer>
      <noscript><p class="no-script">请启用 JavaScript 以浏览书架。</p></noscript>
    </main>
    <p id="shelf-help" class="sr-only">
      拖动书脊排序；触摸屏上请先长按。使用左右方向键、Home 和 End 选择书本，
      按住 Shift 并使用这些键调整顺序。按 Enter 翻阅，Escape 取消移动或隐藏封面预览。
    </p>
    <p id="shelf-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
    <figure class="cover-preview" aria-hidden="true">
      <div class="cover-preview__book"><img class="cover-preview__image" alt="" hidden /><span class="cover-preview__title"></span></div>
      <figcaption></figcaption>
    </figure>
  </body>
</html>
